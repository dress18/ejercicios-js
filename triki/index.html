<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triki</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Triki</h1>
    <p id="mensaje" aria-live="polite"></p>

    <div id="tablero">
        <button type="button" class="casilla" data-indice="0" aria-label="Casilla 1"></button>
        <button type="button" class="casilla" data-indice="1" aria-label="Casilla 2"></button>
        <button type="button" class="casilla" data-indice="2" aria-label="Casilla 3"></button>
        <button type="button" class="casilla" data-indice="3" aria-label="Casilla 4"></button>
        <button type="button" class="casilla" data-indice="4" aria-label="Casilla 5"></button>
        <button type="button" class="casilla" data-indice="5" aria-label="Casilla 6"></button>
        <button type="button" class="casilla" data-indice="6" aria-label="Casilla 7"></button>
        <button type="button" class="casilla" data-indice="7" aria-label="Casilla 8"></button>
        <button type="button" class="casilla" data-indice="8" aria-label="Casilla 9"></button>
    </div>

    <button type="button" id="reiniciar">Reiniciar</button>

    <script type="module" src="src/app.js"></script>
</body>
</html>
