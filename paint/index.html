<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paint</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  </head>
  <body>
    <div id="container">
      <header>
        <div class="brand">
          <h1>Paint</h1>
        </div>
        <span id="grid-status" class="status">Matriz 24 × 16</span>
        <span class="spacer"></span>
        <button id="grid-btn" class="header-btn" title="Tamaño de la matriz" aria-label="Tamaño de la matriz">
          <span class="material-symbols-outlined">grid_on</span>
          <span>Matriz</span>
        </button>
      </header>

      <div class="workspace">
        <aside>
          <nav aria-label="Herramientas">
            <input type="color" id="color-picker" value="#000000" title="Color del pincel" aria-label="Color del pincel" />

            <button id="draw-btn" class="tool active" title="Pincel" aria-label="Pincel" aria-pressed="true">
              <span class="material-symbols-outlined">brush</span>
            </button>
            <button id="erase-btn" class="tool" title="Borrar" aria-label="Borrar" aria-pressed="false">
              <span class="material-symbols-outlined">ink_eraser</span>
            </button>

            <span class="separator" aria-hidden="true"></span>

            <button id="rectangle-btn" class="tool" title="Rectángulo" aria-label="Rectángulo" aria-pressed="false">
              <span class="material-symbols-outlined">rectangle</span>
            </button>
            <button id="ellipse-btn" class="tool" title="Círculo / elipse" aria-label="Círculo o elipse" aria-pressed="false">
              <span class="material-symbols-outlined">circle</span>
            </button>
            <button id="picker-btn" class="tool" title="Capturar color" aria-label="Capturar color" aria-pressed="false">
              <span class="material-symbols-outlined">colorize</span>
            </button>

            <span class="separator" aria-hidden="true"></span>

            <button id="clear-btn" title="Limpiar dibujo" aria-label="Limpiar dibujo">
              <span class="material-symbols-outlined">delete</span>
            </button>
            <button id="save-btn" title="Guardar dibujo" aria-label="Guardar dibujo">
              <span class="material-symbols-outlined">save</span>
            </button>
          </nav>
        </aside>

        <main>
          <canvas id="canvas" width="480" height="320" aria-label="Lienzo de dibujo"></canvas>
        </main>
      </div>

      <footer>
        <span class="footer-label">Colores rápidos</span>
        <div class="palette" id="palette" role="group" aria-label="Paleta de colores rápidos"></div>
      </footer>
    </div>

    <dialog id="options-modal" aria-labelledby="modal-title">
      <form id="grid-form" method="dialog">
        <h2 id="modal-title">Tamaño de la matriz</h2>

        <label class="field" for="cols-range">
          <span>Columnas <output id="cols-output" for="cols-range">24</output></span>
          <input type="range" id="cols-range" min="8" max="64" step="1" value="24" />
        </label>

        <label class="field" for="rows-range">
          <span>Filas <output id="rows-output" for="rows-range">16</output></span>
          <input type="range" id="rows-range" min="8" max="64" step="1" value="16" />
        </label>

        <label class="switch-row">
          <input type="checkbox" id="lines-checkbox" checked />
          <span>Mostrar líneas de la cuadrícula</span>
        </label>

        <div class="modal-actions">
          <button type="button" id="modal-cancel">Cancelar</button>
          <button type="submit" id="modal-apply" class="primary">Aplicar</button>
        </div>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
